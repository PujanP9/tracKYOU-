<style>

.auth-gate[hidden]{display:none}

.auth-msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--ink2)}

<title>tracKYOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: icon rail + month calendar + day panel on desktop; bottom nav + bottom sheet on phones.
   Light, warm-paper UI; gold appears only in the wordmark and five-star moments. */
:root{
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#FAF8F4; --surface:#FFFFFF; --surface2:#F3F0EA; --line:#E8E3D9; --line2:#D6D0C3;
  --ink:#1F2430; --ink2:#566073; --ink3:#737A8A;
  --must:#F0594E; --imp:#F59A23; --should:#3B82F6; --done:#23A06E; --gold:#C8961E; --goldInk:#8A6410;
  --teal:#14A39A; --purple:#8B6CE0; --green:#3FB27F; --pink:#E26FA3; --yellow:#E2B93B;
  --shadow:0 10px 34px rgba(31,36,48,.16);
  --pass:rgba(31,36,48,.30);
  --on-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14161B; --surface:#1C1F26; --surface2:#242833; --line:#2C313D; --line2:#3A4150;
  --ink:#EEF0F5; --ink2:#A5ABBA; --ink3:#8C93A5;
  --must:#FF7A70; --imp:#FFB04A; --should:#6AA3FF; --done:#4CD39B; --gold:#E3B54A; --goldInk:#E3B54A;
  --teal:#3CCBC1; --purple:#A892F0; --green:#5CCB98; --pink:#F08BBB; --yellow:#EBCB62;
  --shadow:0 10px 34px rgba(0,0,0,.5); --pass:rgba(238,240,245,.30); --on-ink:#14161B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161B; --surface:#1C1F26; --surface2:#242833; --line:#2C313D; --line2:#3A4150;
  --ink:#EEF0F5; --ink2:#A5ABBA; --ink3:#8C93A5;
  --must:#FF7A70; --imp:#FFB04A; --should:#6AA3FF; --done:#4CD39B; --gold:#E3B54A; --goldInk:#E3B54A;
  --teal:#3CCBC1; --purple:#A892F0; --green:#5CCB98; --pink:#F08BBB; --yellow:#EBCB62;
  --shadow:0 10px 34px rgba(0,0,0,.5); --pass:rgba(238,240,245,.30); --on-ink:#14161B; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--should);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{min-height:100%;display:block;padding-bottom:92px}
#main{padding:20px 16px 24px;max-width:900px;margin:0 auto;min-width:0}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;
  background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.brand{display:none}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border-radius:14px;color:var(--ink3);font-size:12px;font-weight:600}
.nb svg{width:24px;height:24px}
.nb[aria-current="page"]{color:var(--ink)}
.nb[aria-current="page"] svg{stroke-width:2.2}
.fab{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:var(--shadow);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:26px;height:26px}
.fab .lbl{display:none}
#day{display:none}

@media (min-width:720px){
  #app{display:grid;grid-template-columns:84px minmax(0,1fr);padding-bottom:0}
  #app[data-screen="cal"],#app[data-screen="today"]{grid-template-columns:84px minmax(0,1fr) 380px}
  #nav{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:6px;border-top:0;border-right:1px solid var(--line);padding:20px 10px;grid-column:1;grid-row:1}
  #main{grid-column:2;grid-row:1;width:100%;padding:32px 28px 40px}
  #day{display:block;grid-column:3;grid-row:1;position:sticky;top:0;height:100dvh;overflow:auto;border-left:1px solid var(--line);background:var(--surface)}
  #app:not([data-screen="cal"]):not([data-screen="today"]) #day{display:none}
  .brand{display:block;order:-2;font-size:11px;text-align:center;margin-bottom:10px;font-weight:300;letter-spacing:-.01em;line-height:1.1}
  .brand b{display:block;font-weight:800;color:var(--goldInk);font-size:12px}
  .fab{order:-1;width:100%;height:48px;border-radius:14px;margin:0 0 10px;box-shadow:none}
  .fab svg{width:22px;height:22px}
  .nb{min-height:58px}
  #scrim{display:none!important}
}
@media (min-width:1100px){
  #app[data-screen="cal"],#app[data-screen="today"]{grid-template-columns:200px minmax(0,1fr) 400px}
  #app{grid-template-columns:200px minmax(0,1fr)}
  #nav{padding:24px 16px}
  .brand{font-size:26px;text-align:left;margin:0 6px 20px}
  .brand b{display:inline;font-size:26px}
  .nb{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:46px;font-size:15px}
  .fab{flex-direction:row;gap:8px}
  .fab .lbl{display:inline;font-weight:700;font-size:15px}
}
@media (max-width:719px){
  #day{display:block;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-radius:22px 22px 0 0;
    box-shadow:var(--shadow);max-height:78dvh;overflow:auto;transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
  #day.open{transform:none}
  #day.full{height:94dvh;max-height:94dvh}
  #scrim{position:fixed;inset:0;background:rgba(15,17,22,.42);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  #scrim.on{opacity:1;pointer-events:auto}
}

/* ---------- headings ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
h1,h2,h3{font-family:var(--display);margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.h-title{font-size:30px;line-height:1.1}
.bar{display:flex;align-items:center;gap:8px}
.bar .grow{flex:1;min-width:0}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.ibtn:hover{background:var(--surface2)}
.ibtn svg{width:22px;height:22px}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600}
.pill.btn{cursor:pointer}
.pill.btn:hover{background:var(--line)}

/* ---------- month ---------- */
.mstats{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0 18px;color:var(--ink2);font-size:14px}
.mstats b{color:var(--ink);font-weight:600}
.wk,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wk div{text-align:center;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink3);padding:0 0 6px;text-transform:uppercase}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;padding:6px 2px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden;text-align:center;transition:background .15s,transform .15s}
.cell:hover{border-color:var(--line2)}
.cell.out{background:transparent;border-color:transparent}
.cell.out .dn{color:var(--ink3);opacity:.6}
.cell.past{background:var(--surface2);border-color:transparent}
.cell.past .dn{color:var(--ink3)}
.cell.sel{box-shadow:0 0 0 2.5px var(--ink);border-color:transparent}
.cell.drop{box-shadow:0 0 0 2.5px var(--should);background:color-mix(in srgb,var(--should) 10%,var(--surface))}
.dn{font-family:var(--display);font-weight:600;font-size:15px;line-height:24px;min-width:26px;height:26px;border-radius:9px;display:inline-grid;place-items:center;position:relative;z-index:1}
.cell.today .dn{background:var(--ink);color:var(--on-ink)}
.pass{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pass path{fill:none;stroke:var(--pass);stroke-width:1.4;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.7}
.cell.pass-new .pass path{stroke-dasharray:140;stroke-dashoffset:140;animation:draw .5s .1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ev{font-size:11px;font-weight:600;line-height:1.1;color:var(--ink2);max-width:100%;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:1}
.ev .t{display:none}
.dots{display:flex;gap:3px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:8px;position:relative;z-index:1}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.dot.must{background:var(--must)} .dot.imp{background:var(--imp)} .dot.should{border:1.6px solid var(--should)} .dot.rem{width:5px;height:5px;background:var(--ink3)}
.more{font-size:10px;font-weight:700;color:var(--ink3);line-height:1}
.wbar{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:3px;background:var(--teal);opacity:.85}
.gl{position:absolute;top:4px;right:5px;font-size:11px;line-height:1;color:var(--ink3);z-index:1}
.gl.ok{color:var(--done);font-weight:700}
.tprog{position:absolute;left:0;bottom:0;height:3px;background:var(--ink);border-radius:0 3px 3px 0}
.cell.work .dots{margin-bottom:4px}
@media (min-width:720px){
  .cell{min-height:98px;align-items:stretch;padding:8px 8px 12px;text-align:left}
  .dn{align-self:flex-start}
  .ev .t{display:inline}
  .dots{justify-content:flex-start}
  .gl{top:8px;right:9px;font-size:13px}
  .wbar{left:8px;right:8px}
  .wk,.grid{gap:6px}
}

/* ---------- upcoming ---------- */
.upc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:22px}
.uc{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.uc .em{font-size:22px;line-height:1}
.uc .un{font-weight:600;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uc .ud{font-size:13px;color:var(--ink2)}
.uc .ud b{font-family:var(--display);font-size:17px;color:var(--ink)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 0}

/* ---------- day panel ---------- */
.dp{padding:10px 18px 24px}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 10px}
@media (min-width:720px){.xbtn{display:none}.grab{display:none}.dp{padding:28px 22px 32px}}
.dp-h{display:flex;align-items:flex-start;gap:10px}
.dp-h h2{font-size:28px;line-height:1.1}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin-top:8px}
.state i{width:8px;height:8px;border-radius:50%;background:var(--ink3);display:inline-block}
.state.open i{background:var(--done)} .state.closed i{background:var(--imp)}
.note{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--surface2);font-size:14px;color:var(--ink2);line-height:1.4}
.tot{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:14px;color:var(--ink2)}
.tot b{color:var(--ink);font-weight:600}
.grp{margin-top:22px}
.gh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin-bottom:6px}
.gh .dot{width:9px;height:9px}
.gh .c{margin-left:auto;font-weight:600;color:var(--ink3)}
.row{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-radius:14px;cursor:pointer;text-align:left;width:100%}
.row:hover{background:var(--surface2)}
.row[draggable="true"]{cursor:grab}
.row.dragging{opacity:.45}
.rb{flex:1;min-width:0}
.rt{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.rm{font-size:13px;color:var(--ink2);margin-top:1px}
.rm.un{font-style:italic;color:var(--ink3)}
.rs{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap;padding-top:2px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;margin-top:0;position:relative;background:var(--surface);transition:background .2s,border-color .2s,transform .15s}
.chk::after{content:'';position:absolute;inset:-8px}
.chk svg{width:16px;height:16px;stroke:var(--on-ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s .05s}
.chk.done{background:var(--done);border-color:var(--done)}
.chk.done svg{stroke-dashoffset:0}
.chk.partial{border-color:var(--imp);background:conic-gradient(var(--imp) calc(var(--p)*1%),var(--surface) 0)}
.chk.skipped{border-color:var(--ink3);color:var(--ink3);font-size:15px;font-weight:700}
.chk.future{border-style:dashed}
.chk.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.18)}}
.meter{height:5px;border-radius:5px;background:var(--surface2);margin-top:7px;overflow:hidden;max-width:220px}
.meter i{display:block;height:100%;background:var(--imp);border-radius:5px;transition:width .5s ease}
.stars{color:var(--line2);letter-spacing:1px;font-size:13px}
.stars b{color:var(--gold);font-weight:400}
.stars.big{font-size:26px;letter-spacing:3px}
.stars.big.cel b{display:inline-block;animation:starpop .5s both}
@keyframes starpop{from{transform:scale(.3);opacity:0}60%{transform:scale(1.25)}to{transform:none;opacity:1}}
.shape{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.shape.must{background:var(--must)} .shape.imp{background:var(--imp)} .shape.should{border:2px solid var(--should)}
.erow{display:flex;gap:12px;align-items:center;padding:10px 6px;border-radius:14px;width:100%;text-align:left}
.erow .em{width:30px;text-align:center;font-size:20px}
.erow .cd{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.erow .cd b{font-family:var(--display);font-size:16px;color:var(--ink)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;margin-top:22px;padding:12px 14px;border-radius:14px;border:1.5px dashed var(--line2);color:var(--ink2);font-weight:600;justify-content:center;min-height:48px}
.addrow:hover{border-color:var(--ink3);color:var(--ink)}
.empty{padding:26px 10px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}

/* ---------- detail ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;min-height:44px;margin-left:-6px;padding:0 8px;border-radius:12px}
.back svg{width:20px;height:20px}
.dt h2{font-size:26px;margin-top:2px;overflow-wrap:anywhere}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--surface2);margin-top:12px}
.seg button{min-height:44px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink2);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.fld{margin-top:20px}
.fld>label,.fld>.lb{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.inp{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.inp:focus{border-color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:48px;height:48px;border-radius:50%;background:var(--surface2);font-size:22px;font-weight:600}
.stepper input[type=range]{flex:1;min-width:0;accent-color:var(--imp);height:34px}
.live{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:16px}
.live b{font-family:var(--display);font-size:20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv span:first-child{color:var(--ink2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--ink);color:var(--on-ink)}
.btn.sec{background:var(--surface2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line)}
.btn.danger{color:var(--must)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2)}

/* ---------- today ---------- */
.today-h .h-title{font-size:34px;margin-top:4px}
.daybar{margin:18px 0 6px;height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.daybar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.daynote{font-size:14px;color:var(--ink2)}
.wblock{display:flex;gap:14px;align-items:stretch;margin-top:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.wblock .tb{width:6px;border-radius:6px;background:var(--teal);flex:none}
.wblock .wt{font-weight:700}
.wblock .wm{font-size:14px;color:var(--ink2);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}@media (min-width:720px){#app[data-screen="today"] #main .grp:first-of-type{margin-top:28px}}

/* ---------- goals ---------- */
.goals{display:grid;gap:14px;margin-top:20px}
.goal{padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);width:100%;text-align:left}
.goal .gt{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.gnums{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:12px}
.gnums .big{font-family:var(--display);font-size:26px;font-weight:700}
.gnums .of{color:var(--ink2)}
.gbar{height:12px;border-radius:12px;background:var(--surface2);margin-top:12px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:12px;background:var(--gc,var(--teal));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.gfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin-top:10px;font-size:14px;color:var(--ink2)}
.gfoot b{color:var(--ink)}
.contr{margin-top:14px;border-top:1px solid var(--line);padding-top:8px}
.contr div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;font-size:14px}
.contr span:first-child{color:var(--ink2)}
.goal-tools{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.goal-slider-row{display:flex;align-items:center;gap:10px}
.goal-slider-row input[type=range]{flex:1;min-width:0;accent-color:var(--gc,var(--teal));height:34px}
.goal-slider-value{min-width:72px;text-align:right;font-family:var(--display);font-weight:700}
.goal-save{margin-top:10px;width:100%}
.goal-delete{margin-top:10px;width:100%}
.goal-complete{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(15,17,22,.5);backdrop-filter:blur(8px)}
.goal-complete.on{display:flex}
.goal-complete-card{width:min(420px,100%);padding:28px 24px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);text-align:center;animation:goalCelebrate .28s cubic-bezier(.2,.8,.2,1)}
.goal-complete-card h2{font-size:28px;margin-top:8px}
.goal-complete-card p{color:var(--ink2);line-height:1.5;margin:10px 0 20px}
.goal-complete-stars{font-size:32px;letter-spacing:3px;color:var(--gold)}
.goal-complete-actions{display:flex;justify-content:center}
.goal-complete-actions .btn{min-width:150px}
.goal.fade-away{animation:goalFadeAway .5s ease forwards}
@keyframes goalCelebrate{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes goalFadeAway{to{opacity:0;transform:scale(.97);height:0;margin:0;padding-top:0;padding-bottom:0;border-width:0;overflow:hidden}}
@media (prefers-reduced-motion:reduce){.goal.fade-away{animation:none;opacity:0}}
/* ---------- search ---------- */
.sf{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 16px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);margin-top:16px}
.sf:focus-within{border-color:var(--ink)}
.sf svg{width:22px;height:22px;color:var(--ink3);flex:none}
.sf input{flex:1;min-width:0;border:0;background:none;outline:0;height:50px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip.sm{min-height:44px}
.chipsel{min-height:36px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600;font-size:14px;color:var(--ink2)}
.tbar{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--surface2);font-size:14px;color:var(--ink2)}
.tbar b{font-family:var(--display);font-size:18px;color:var(--ink)}
.rg{margin-top:20px}
.res{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:12px 10px;border-radius:14px}
.res:hover{background:var(--surface2)}
.res .rd{width:54px;flex:none;text-align:center;line-height:1.1}
.res .rd b{display:block;font-family:var(--display);font-size:20px}
.res .rd span{font-size:12px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* ---------- sheets ---------- */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;background:rgba(15,17,22,.46)}
.modal.on{display:flex}
.msheet{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));animation:rise .26s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}}
@media (min-width:720px){.modal{align-items:center}.msheet{border-radius:24px;padding-bottom:22px}}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface2);border-radius:14px;margin-top:6px}
.tabs button{flex:1;min-height:42px;border-radius:11px;font-weight:600;font-size:14px;color:var(--ink2);padding:0 2px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tin{width:100%;border:0;border-bottom:2px solid var(--line);background:none;font-family:var(--display);font-weight:600;font-size:26px;padding:16px 0 10px;outline:0;letter-spacing:-.02em;margin-top:6px}
.tin:focus{border-color:var(--ink)}
.tin::placeholder{color:var(--ink3);opacity:.7}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.chip.in{padding:0 12px}
.chip input{border:0;background:none;outline:0;min-width:0;font-weight:600;color:inherit}
.chip.pri[aria-pressed="true"]{background:var(--surface);color:var(--ink);border-width:2px}
.chip.pri.must[aria-pressed="true"]{border-color:var(--must)} .chip.pri.imp[aria-pressed="true"]{border-color:var(--imp)} .chip.pri.should[aria-pressed="true"]{border-color:var(--should)}
.hint{font-size:14px;color:var(--ink2);margin-top:10px;min-height:20px}
.hint b{color:var(--ink)}
.foot{display:flex;gap:10px;align-items:center;margin-top:22px}
.foot .grow{flex:1}
.mcards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.mcard{padding:14px 8px;border-radius:14px;border:1.5px solid var(--line);text-align:center;font-weight:600;font-size:14px;min-height:64px}
.mcard[aria-pressed="true"]{border-color:var(--ink);background:var(--surface2)}
.mcard span{display:block;font-size:20px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.swrow{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.swrow input[type=color]{width:44px;height:36px;border:0;padding:0;background:none;border-radius:8px}
.wordmark{font-size:26px;font-weight:300;letter-spacing:-.02em}
.wordmark b{font-weight:800;color:var(--goldInk)}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--on-ink);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;opacity:0;pointer-events:none;transition:all .25s;max-width:calc(100% - 32px);font-size:14px;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--gold);font-weight:700;min-height:32px;padding:0 4px}
@media (min-width:720px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cell.pass-new .pass path{stroke-dashoffset:0}}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var pad=function(n){return String(n).padStart(2,'0')};
var D=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
var S=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var addDays=function(s,n){var d=D(s);d.setDate(d.getDate()+n);return S(d)};

var tm=function(s){var a=s.split(':').map(Number);return a[0]*60+a[1]};
var t12=function(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h%12||12)+':'+pad(mm)+' '+(h<12?'AM':'PM')};
var rng=function(a,b){var x=t12(tm(a)),y=t12(tm(b));return x.slice(-2)===y.slice(-2)?x.slice(0,-3)+'–'+y:x+'–'+y};
var durText=function(m){m=Math.round(m);var h=Math.floor(m/60),r=m%60;if(!h)return r+' min';return r?h+' h '+r+' min':h+' h'};
var money=function(n){return '$'+Math.round(n).toLocaleString('en-AU')};
var dLong=function(s){return WDL[dow(s)]+', '+D(s).getDate()+' '+MON[D(s).getMonth()]};
var dShort=function(s){return D(s).getDate()+' '+MS[D(s).getMonth()]};
var plural=function(n,w){return n+' '+w+(n===1?'':'s')};

/* ---------- state ---------- */
var T0='2026-10-03';
var TODAY=T0,NOWMIN=20*60+58;
var view={y:2026,m:9},sel=T0,screen='cal',detail=null,corr=false;
var items=[],logs={},goals=[],nid=100,undoFn=null,toastTimer=null,justPassed=null;
var srch={q:'Uber',type:'all',when:'any',inc:false,goal:''};
var open={};
var addS=null;
var goalDraft={};

var CATS={work:{n:'Work',c:'--teal'},study:{n:'Study',c:'--purple'},health:{n:'Health',c:'--green'},home:{n:'Home',c:'--pink'},life:{n:'Life',c:'--yellow'}};

var ic={
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>',
 today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>',
 goals:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg>',
 search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg>',
 chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
 chevl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 tick:'<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>'
};

/* ---------- data ---------- */
function mk(o){o.id=o.id||('i'+(nid++));items.push(o);return o}
function hash(s){var x=7;for(var i=0;i<s.length;i++)x=(x*31+s.charCodeAt(i))>>>0;return x%10}
function planned(it){if(it.dur)return it.dur;if(it.start&&it.end){var d=tm(it.end)-tm(it.start);return d<=0?d+1440:d}return 0}
function occ(s){return items.filter(function(it){
  if(!it.rec)return it.date===s;
  if(s<it.date)return false;
  if(it.ex&&it.ex.indexOf(s)>-1)return false;
  if(it.rec==='daily')return true;
  if(it.rec==='yearly')return D(s).getMonth()===D(it.date).getMonth()&&D(s).getDate()===D(it.date).getDate();
  return it.rec.indexOf(dow(s))>-1;
})}
function sortIt(a,b){
  var sa=a.start?tm(a.start):1e4,sb=b.start?tm(b.start):1e4;
  return sa-sb||((PRI[a.pri]||{o:3}).o-(PRI[b.pri]||{o:3}).o);
}
function trackable(it){return it.kind==='task'||it.kind==='work'}
function key(it,s){return it.id+'@'+s}
function L(it,s){return logs[key(it,s)]}
function stateOf(s){var n=diff(s,TODAY);return n<0?'future':n===0?'open':n===1?'closed':'locked'}
function pctOf(it,l){
  if(!l)return null;
  if(l.o==='done')return 100;
  if(l.o==='skipped')return 0;
  var p=planned(it);return p?Math.min(99,Math.round((l.actual||0)/p*100)):0;
}
function starsN(p){return p>=100?5:p>=80?4:p>=50?3:p>=25?2:p>=1?1:0}
function starsHTML(p,big,cel){
  var n=starsN(p);
  if(n===0)return '<span class="stars'+(big?' big':'')+'" aria-label="No stars">✕</span>';
  return '<span class="stars'+(big?' big':'')+(cel?' cel':'')+'" role="img" aria-label="'+n+' of 5 stars"><b>'+'★'.repeat(n)+'</b>'+'★'.repeat(5-n)+'</span>';
}
function setLog(it,s,patch){
  var k=key(it,s),l=logs[k]||{};
  Object.keys(patch).forEach(function(p){l[p]=patch[p]});
  if(l.o==='done'&&trackable(it)&&it.kind==='task'){l.actual=planned(it)}
  if(l.o==='done'&&it.kind==='work'&&!l.actual){l.actual=planned(it)}
  logs[k]=l;return l;
}
function contrib(it,l,g){
  if(!l||it.goal!==g.id)return 0;
  if(g.metric==='minutes')return (l.o==='done'||l.o==='partial')?(l.actual||planned(it)):0;
  if(g.metric==='money')return (it.alloc&&l.income&&l.o!=='skipped')?l.income:0;
  return l.o==='done'?1:0;
}
function gSum(g){var t=0;Object.keys(logs).forEach(function(k){var p=k.split('@'),it=items.filter(function(x){return x.id===p[0]})[0];if(it)t+=contrib(it,logs[k],g)});return t}
function gVal(g){return g.base+(g.manual||0)+gSum(g)}

function init(){
  items=[];
  logs={};
  goals=[];
  nid=100;
  var now=new Date();
  TODAY=S(now);
  T0=TODAY;
  NOWMIN=now.getHours()*60+now.getMinutes();

/* ---------- month calendar ---------- */
function monthStats(){
  var inc=0,mins=0,pre=view.y+'-'+pad(view.m+1)+'-';
  Object.keys(logs).forEach(function(k){
    var p=k.split('@');if(p[1].indexOf(pre)!==0)return;
    var l=logs[k],it=items.filter(function(x){return x.id===p[0]})[0];
    if(!it||it.kind!=='work'||l.o==='skipped')return;    inc+=l.income||0;mins+=l.actual||0;
  });
  return {inc:inc,mins:mins};
}
function cellHTML(s,inMonth){
  var st=stateOf(s),list=occ(s).sort(sortIt),evs=list.filter(function(i){return i.kind==='event'});
  var tr=list.filter(trackable),rems=list.filter(function(i){return i.kind==='reminder'});
  var dots=tr.slice().sort(sortIt).sort(function(a,b){return PRI[a.pri].o-PRI[b.pri].o}).map(function(i){return PRI[i.pri].cls});
  var dh=dots.slice(0,4).map(function(c){return '<span class="dot '+c+'"></span>'}).join('');
  if(dots.length<4&&rems.length)dh+='<span class="dot rem"></span>';
  if(dots.length>4)dh+='<span class="more">+'+(dots.length-4)+'</span>';
  var hasWork=list.some(function(i){return i.kind==='work'});
  var gl='';
  if(st==='closed'||st==='locked'||st==='open'&&false){
    if(tr.length){
      var marks=tr.map(function(i){return L(i,s)});
      var un=marks.some(function(m){return !m}),all=marks.every(function(m){return m&&m.o==='done'});
      gl=all?'<span class="gl ok" aria-hidden="true">✓</span>':un?'<span class="gl" aria-hidden="true">·</span>':'<span class="gl" aria-hidden="true">★</span>';
    }
  }
  var evh=evs.slice(0,1).map(function(e){return '<span class="ev"><span aria-hidden="true">'+EV[e.evType||'special'][0]+'</span><span class="t"> '+esc(e.title)+'</span></span>'}).join('');

function upcomingList(){

      '<span class="ud"><b class="num">'+pc+'%</b> · Due today</span></span></button>';

/* ---------- day panel ---------- */
function rowHTML(it,s,dragOk){
  var st=stateOf(s),l=L(it,s),p=pctOf(it,l),cls='chk',inner='',meta='',end='',un=false;
  var pl=planned(it);
  var when=it.start&&it.end?rng(it.start,it.end)+' · '+durText(pl):it.start?t12(tm(it.start))+(pl?' · '+durText(pl):''):pl?durText(pl):'';
  if(st==='future'){cls+=' future'}
  else if(!l){}
  else if(l.o==='done'){cls+=' done';inner=ic.tick}
  else if(l.o==='partial'){cls+=' partial'}
  else if(l.o==='skipped'){cls+=' skipped';inner='✕'}
  var style=l&&l.o==='partial'?' style="--p:'+p+'"':'';
  if(l&&l.o==='partial'){
    end='<span class="num">'+(l.actual||0)+' / '+pl+' min</span><br>'+starsHTML(p);
    meta='<div class="meter" aria-hidden="true"><i style="width:'+p+'%"></i></div>';
  } else if(l&&l.o==='done'){
    if(it.kind==='work'&&l.income){end='<span class="num">'+money(l.income)+'</span><br><span class="num">'+money(l.income/((l.actual||pl)/60))+'/h</span>'}
    else end='Done';
  } else if(l&&l.o==='skipped'){end='Didn’t happen'}
  else if(st==='closed'||st==='locked'){un=true;end='<span style="font-style:italic;color:var(--ink3)">Unmarked</span>'}
  var lbl=l?(l.o==='done'?'Completed':l.o==='partial'?'Partial':'Didn’t happen'):'Not marked';
  var canTick=st==='open'||(st==='closed'&&!l);
  var cb='<button class="'+cls+'" data-act="toggle" data-id="'+it.id+'" data-date="'+s+'"'+style+' aria-label="'+esc(it.title)+': '+lbl+(canTick?'. Toggle completed':'')+'"'+(canTick?'':' disabled')+'>'+inner+'</button>';
  if(!canTick)cb=cb.replace('<button','<span role="img"').replace('</button>','</span>').replace(' disabled','').replace(' data-act="toggle"','');
  var dr=dragOk&&(st==='open'||st==='future')?' draggable="true" data-drag="'+it.id+'|'+s+'"':'';
  return '<div class="row" role="button" tabindex="0" data-act="open" data-id="'+it.id+'" data-date="'+s+'"'+dr+'>'+cb+
   '<div class="rb"><div class="rt">'+esc(it.title)+'</div><div class="rm">'+when+(it.rec&&it.rec!=='yearly'?(when?' · ':'')+'Repeats':'')+'</div>'+meta+'</div><div class="rs">'+end+'</div></div>';
}
function evRowHTML(it,s){

  var sub=it.start?t12(tm(it.start)):it.allDay?'All day':'';
  if(it.kind==='reminder'&&it.rem){var rr=it.rem.slice().sort(function(a,b){return b-a});sub+=(sub?' · ':'')+'Reminds '+rr.map(function(m){return m===0?'at set time':m>=60?(m/60)+' h before':m+' min before'}).join(', ');}
  return '<button class="erow" data-act="open" data-id="'+it.id+'" data-date="'+s+'"><span class="em" aria-hidden="true">'+e[0]+'</span><span style="min-width:0"><span class="rt" style="display:block">'+esc(it.title)+'</span><span class="rm" style="display:block">'+e[1]+(sub?' · '+sub:'')+'</span></span>'+cd+'</button>';

function weekIncome(s){

  return t;

   note+tot+evh+groups+empty+add+'</div>';

    '<div class="rm" style="margin-top:6px">'+dLong(s)+(it.start&&it.end?' · '+rng(it.start,it.end):it.start?' · '+t12(tm(it.start)):'')+(it.rec&&it.rec!=='yearly'?' · Repeats '+(it.rec==='daily'?'every day':it.rec.map(function(d){return WD[d]}).join(', ')):'')+'</div></div>';
  var body='';

      body+='';

       '<div class="live" id="live"><b class="num">'+(l.actual||0)+' / '+pl+' min</b><span class="num">'+p+'%</span>'+starsHTML(p)+'</div></div>';

    }

    if(st==='locked'){body='<div class="fld"><div class="lb">Record</div><div class="live" style="margin-top:0"><b>'+({done:'Completed',partial:'Partial',skipped:'Didn’t happen',unmarked:'Unmarked'}[o])+'</b>'+(l&&l.o==='partial'?'<span class="num">'+(l.actual||0)+' / '+pl+' min</span>'+starsHTML(pctOf(it,l)):'')+(l&&l.income?'<span class="num">'+money(l.income)+'</span>':'')+'</div></div>'+body.replace(/<div class="fld"><div class="lb">Record<[\s\S]*?<\/div><\/div><\/div>/,'');

function gUnit(g,v){

}
function contribList(g){
  var out=[];
  Object.keys(logs).forEach(function(k){
    var p=k.split('@'),it=findItem(p[0]);if(!it)return;
    var c=contrib(it,logs[k],g);if(c)out.push({s:p[1],c:c,t:it.title});

}
var GOAL_AFFIRMATIONS=[

  'That is another win in the bank.',

  'You should be proud of that one.'

function randomAffirmation(){return GOAL_AFFIRMATIONS[Math.floor(Math.random()*GOAL_AFFIRMATIONS.length)]}
function goalManualValue(g){

  return Math.max(0,Math.min(g.target,Math.round(Number(v)||0)));

function goalManualStep(g){

function goalManualLabel(g){

function showGoalCompletion(g){

function finishGoal(){

  },500);

function deleteGoal(id){

function saveGoalProgress(id){

/* ---------- search ---------- */
function stem(q){q=q.toLowerCase();return q.length>5?q.replace(/(ing|s)$/,''):q}
function runSearch(){
  var q=stem(srch.q.trim());if(!q)return null;
  var res=[],cnt={},from='2026-09-01',to=addDays(TODAY,420);
  var inc=q==='income',gl=q==='goal'||q==='goals';
  for(var s=from;s<=to;s=addDays(s,1)){
    occ(s).forEach(function(it){
      var l=L(it,s),g=it.goal?goals.filter(function(x){return x.id===it.goal})[0]:null;
      var hay=(it.title+' '+it.kind+' '+(CATS[it.cat]?CATS[it.cat].n:'')+' '+(it.evType||'')+' '+(g?g.title:'')+' '+(it.wcat||'')).toLowerCase();
      var ok=inc?(l&&l.income>0):gl?!!g:hay.indexOf(q)>-1;
      if(!ok)return;
      if(srch.type!=='all'&&it.kind!==srch.type)return;
      if(srch.when==='past'&&s>=TODAY)return;
      if(srch.when==='up'&&s<TODAY)return;
      if(srch.inc&&!(l&&l.income>0))return;
      if(srch.goal&&it.goal!==srch.goal)return;
      if(s>TODAY&&it.rec){cnt[it.id]=(cnt[it.id]||0)+1;if(cnt[it.id]>3)return}
      res.push({it:it,s:s,l:l});
    });
  }
  return res;
}
function resRow(r){
  var it=r.it,l=r.l,pl=planned(it),meta=[],st=stateOf(r.s);
  if(it.kind==='work'){var m=l&&l.actual?l.actual:pl;meta.push(durText(m).replace(' min','m'))}
  else if(pl)meta.push(durText(pl));
  if(it.kind==='event')meta.push(EV[it.evType||'special'][1]);
  var right='';
  if(l&&l.income)right=money(l.income);
  else if(l&&l.o==='partial')right=(l.actual||0)+'/'+pl+' min';
  else if(l&&l.o==='done')right='Done';
  else if(l&&l.o==='skipped')right='Didn’t happen';
  else if(st==='closed'||st==='locked')right='<i style="color:var(--ink3)">Unmarked</i>';
  else{var d=diff(TODAY,r.s);right=d===0?'Today':d>0?d+' days':''}
  return '<button class="res" data-act="pick-go" data-date="'+r.s+'"><span class="rd"><b class="num">'+D(r.s).getDate()+'</b><span>'+MS[D(r.s).getMonth()]+'</span></span><span style="flex:1;min-width:0"><span class="rt" style="display:block">'+esc(it.title)+'</span><span class="rm" style="display:block">'+WD[dow(r.s)]+(meta.length?' · '+meta.join(' · '):'')+'</span></span><span class="rs num">'+right+'</span></button>';
}
function resultsHTML(){
  var res=runSearch();

  if(!res.length)return '<div class="empty"><b>Nothing found</b>Try a different word or clear the filters.</div>';
  var past=res.filter(function(r){return r.s<TODAY}).sort(function(a,b){return a.s<b.s?1:-1}),up=res.filter(function(r){return r.s>=TODAY}).sort(function(a,b){return a.s>b.s?1:-1});

    }
    sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:key});
    var json=sub.toJSON();
    if(!json||!json.endpoint||!json.keys){throw new Error('Push subscription did not return valid keys')}
    var res=await supabaseClient.from('push_subscriptions').upsert({user_id:cloudUser.id,endpoint:json.endpoint,p256dh:json.keys.p256dh,auth:json.keys.auth,updated_at:new Date().toISOString()},{onConflict:'endpoint'});
    if(res.error){console.error('push subscription save:',res.error);toast('Could not save notification permission: '+res.error.message);return}
    toast('Notifications enabled');
  }catch(e){
    console.error('enable push:',e);
    toast('Notification setup failed: '+(e&&e.message?e.message:'Unknown error'));
  }
}
function showAuth(){
  $('#authGate').hidden=false;
}
function hideAuth(){
  $('#authGate').hidden=true;
}
var authMode='signin';
function setAuthMode(mode){
  authMode=mode;
  var signup=mode==='signup';
  $('#authTitle').textContent=signup?'Create your tracKYOU account':'Sign in to tracKYOU';
  $('#authCopy').textContent=signup?'Create an account to keep your tasks, goals and reminders synced across devices.':'Your tasks, goals and reminders will sync across your devices.';
  $('#authNameWrap').hidden=!signup;
  $('#authConfirmWrap').hidden=!signup;
  $('#authPassword').autocomplete=signup?'new-password':'current-password';
  $('#authLogin').textContent=signup?'Create account':'Sign in';
  $('#authMode').innerHTML=signup?'Already have an account? <b>Sign in</b>':'New here? <b>Sign up</b>';
  $('#authMsg').textContent='';
}
async function signIn(){
  var email=$('#authEmail').value.trim(),password=$('#authPassword').value;
  var msg=$('#authMsg'),btn=$('#authLogin');
  if(!email||!password){msg.textContent='Enter your email and password.';return}
  btn.disabled=true;msg.textContent='Signing in…';
  var res=await supabaseClient.auth.signInWithPassword({email:email,password:password});
  if(res.error)msg.textContent=res.error.message;
  else msg.textContent='Signed in.';
  btn.disabled=false;
}
async function signUp(){
  var email=$('#authEmail').value.trim(),password=$('#authPassword').value,confirm=$('#authConfirm').value,name=$('#authName').value.trim();
  var msg=$('#authMsg'),btn=$('#authLogin');
  if(!name){msg.textContent='Enter your name.';return}
  if(!email||!password){msg.textContent='Enter your email and password.';return}
  if(password.length<6){msg.textContent='Password must be at least 6 characters.';return}
  if(password!==confirm){msg.textContent='Passwords do not match.';return}
  btn.disabled=true;msg.textContent='Creating your account…';
  var res=await supabaseClient.auth.signUp({email:email,password:password,options:{data:{full_name:name}}});
  if(res.error){msg.textContent=res.error.message;btn.disabled=false;return}
  if(res.data&&res.data.session){
    msg.textContent='Account created. Signing you in…';
  }else{
    msg.textContent='Account created. Check your email to confirm, then sign in.';
    setAuthMode('signin');
    $('#authEmail').value=email;
  }
  btn.disabled=false;
}

async function bootCloud(){
  var res=await supabaseClient.auth.getSession();
  if(res.data&&res.data.session){
    cloudUser=res.data.session.user;
    hideAuth();
    await cloudLoad();
    startRealtime();
  }else showAuth();
  supabaseClient.auth.onAuthStateChange(function(event,session){
    if(event==='SIGNED_OUT'){
      cloudUser=null;
      if(cloudRealtime){supabaseClient.removeChannel(cloudRealtime);cloudRealtime=null}
      showAuth();
      return;
    }
    if(session&&session.user&&event==='SIGNED_IN'){
      cloudUser=session.user;
      hideAuth();
      cloudLoad().then(startRealtime);
    }
  });
}
var _saveTimer=null;
function persistSoon(){clearTimeout(_saveTimer);_saveTimer=setTimeout(saveData,0)}
var _setLogOriginal=setLog;
setLog=function(it,s,patch){var out=_setLogOriginal(it,s,patch);persistSoon();return out};
var _mkOriginal=mk;
mk=function(o){var out=_mkOriginal(o);persistSoon();return out};

init(); if(!loadData()) saveData(); render();
$('#authLogin').addEventListener('click',function(){authMode==='signup'?signUp():signIn()});
$('#authMode').addEventListener('click',function(){setAuthMode(authMode==='signup'?'signin':'signup')});
$('#authPassword').addEventListener('keydown',function(e){if(e.key==='Enter')authMode==='signup'?signUp():signIn()});
bootCloud();
window.addEventListener('resize',function(){if(!isMobile()){$('#scrim').classList.remove('on')}renderDay()});
})();
